{% extends "base.html" %}
{% block content %}
<div class="actions">
  <a class="btn primary" href="/admin/tasks/new">+ Новая задача</a>
</div>
<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>URL</th>
      <th>Статус</th>
      <th>Парсер</th>
      <th>Создана</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for task in tasks %}
    <tr>
      <td>{{ task.id }}</td>
      <td class="url">{{ task.source_url }}</td>
      <td><span class="badge status-{{ task.status }}">{{ task.status }}</span></td>
      <td>{{ task.parser_type }}</td>
      <td>{{ task.created_at }}</td>
      <td><a href="/admin/tasks/{{ task.id }}">Открыть</a></td>
    </tr>
    {% else %}
    <tr><td colspan="6">Задач пока нет</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
