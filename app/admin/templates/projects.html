{% extends "base.html" %}
{% block content %}
<table class="table">
  <thead>
    <tr><th>ID</th><th>Slug</th><th>Name</th><th>Domain</th><th>Enabled</th><th>Profile</th></tr>
  </thead>
  <tbody>
    {% for p in projects %}
    <tr>
      <td>{{ p.id }}</td>
      <td><a href="/admin/projects/{{ p.id }}"><code>{{ p.slug }}</code></a></td>
      <td>{{ p.name }}</td>
      <td>{{ p.domain or "—" }}</td>
      <td>{{ "yes" if p.enabled else "no" }}</td>
      <td>{{ p.rewrite_profile }}</td>
    </tr>
    {% else %}
    <tr><td colspan="6">Проектов нет. Запустите migration 003.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
